apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: lab }
            - { name: POSTGRES_PASSWORD, value: lab }
            - { name: POSTGRES_DB, value: lab }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "lab"] }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
