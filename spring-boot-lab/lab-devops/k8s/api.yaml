apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-api
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: lab-api:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: api-config }
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api
  namespace: lab
spec:
  type: NodePort
  selector: { app: lab-api }
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
